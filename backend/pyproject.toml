[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeimps-backend"
version = "1.0.0"
description = "AEIMPS Backend - Autonomous Enterprise Intelligence & Multimodal Processing System"
requires-python = ">=3.11"

dependencies = [
    # ─── Web Framework ──────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",

    # ─── Data Validation ────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.2.0",

    # ─── Database ───────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ─── Redis ──────────────────────────────────────────────
    "redis[hiredis]>=5.0.0",

    # ─── Qdrant ─────────────────────────────────────────────
    "qdrant-client>=1.9.0",

    # ─── Neo4j ──────────────────────────────────────────────
    "neo4j>=5.20.0",

    # ─── AI / LLM ───────────────────────────────────────────
    "anthropic>=0.28.0",
    "langchain>=0.2.5",
    "langchain-core>=0.2.10",
    "langchain-anthropic>=0.1.15",
    "langgraph>=0.1.19",

    # ─── Embeddings ─────────────────────────────────────────
    "sentence-transformers>=3.0.1",
    "transformers>=4.41.2",
    "torch>=2.3.0",
    "numpy>=1.26.4",

    # ─── Document Processing ────────────────────────────────
    "pymupdf>=1.24.5",
    "pillow>=10.4.0",
    "pandas>=2.2.2",
    "python-magic>=0.4.27",
    "chardet>=5.2.0",

    # ─── OCR ────────────────────────────────────────────────
    "paddleocr>=2.8.0",
    "paddlepaddle>=2.6.1",

    # ─── Unstructured.io ────────────────────────────────────
    "unstructured>=0.14.5",
    "unstructured[pdf]>=0.14.5",

    # ─── NER / NLP ──────────────────────────────────────────
    "spacy>=3.7.4",
    "rapidfuzz>=3.9.3",

    # ─── Templating ─────────────────────────────────────────
    "jinja2>=3.1.4",

    # ─── Observability ──────────────────────────────────────
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",

    # ─── Security ───────────────────────────────────────────
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.8",
    "python-jose[cryptography]>=3.3.0",
    "python3-saml>=1.16.0",

    # ─── Utilities ──────────────────────────────────────────
    "tenacity>=8.4.1",
    "anyio>=4.4.0",
    "python-dateutil>=2.9.0",
    "orjson>=3.10.5",
    "rich>=13.7.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.10",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
    "faker>=25.9.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers", "scripts"]
